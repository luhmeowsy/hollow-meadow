<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hollow Meadow — ASCII Knight</title>
<style>
  html,body{margin:0;height:100%;background:#03050a;overflow:hidden;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
  #c{display:block;width:100vw;height:100vh}
  #nametag{position:fixed;left:0;top:0;transform:translate(-50%,-100%);color:#eef2ff;
    font:600 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.04em;
    text-shadow:0 0 3px #000,0 0 8px #000,0 0 14px #000;white-space:nowrap;pointer-events:none;display:none}
  #hud{position:fixed;left:14px;bottom:12px;color:#6c7a96;font-size:11px;letter-spacing:.07em;
    text-shadow:0 0 6px #000;pointer-events:none;opacity:0;transition:opacity 1.2s}
  #zoom{position:fixed;right:14px;bottom:12px;color:#93a1bf;font-size:11px;letter-spacing:.08em;
    text-shadow:0 0 6px #000;pointer-events:none;opacity:0;transition:opacity .5s}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 45%,rgba(3,5,10,.25) 0%,rgba(3,5,10,.82) 75%);transition:opacity 1s}
  #start.gone{opacity:0;pointer-events:none}
  #logo{margin:0;font-size:clamp(3px,.72vw,8px);line-height:1;letter-spacing:0;white-space:pre;
    background:linear-gradient(180deg,#f1f5ff 0%,#a8b7d8 45%,#4d5d80 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 6px rgba(140,170,255,.35))}
  #sub{margin-top:18px;color:#7d8bab;font-size:12px;letter-spacing:.35em;text-transform:lowercase}
  #press{margin-top:42px;color:#c9d3ec;font-size:13px;letter-spacing:.3em;animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  #namebox{margin-top:36px;display:none;flex-direction:column;align-items:center}
  #namebox .lbl{color:#8d9bba;font-size:11px;letter-spacing:.4em;margin-bottom:12px}
  #name{background:rgba(8,12,22,.75);border:0;border-bottom:1px solid #56668a;color:#eef2ff;outline:none;
    font:inherit;font-size:22px;letter-spacing:.18em;text-align:center;width:min(360px,80vw);padding:8px 4px;caret-color:#9fd0ff}
  #name:focus{border-bottom-color:#9fd0ff}
  #namebox .hint{margin-top:14px;color:#66758f;font-size:11px;letter-spacing:.3em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="nametag"></div>
<div id="hud">WASD / ARROWS move &nbsp;·&nbsp; SHIFT run &nbsp;·&nbsp; SPACE slash &nbsp;·&nbsp; SCROLL or +/- zoom &nbsp;·&nbsp; M mute</div>
<div id="zoom"></div>
<div id="start">
  <pre id="logo"></pre>
  <div id="sub">a storm over the hollow meadow</div>
  <div id="press">[ press any key ]</div>
  <div id="namebox">
    <div class="lbl">NAME YOUR KNIGHT</div>
    <input id="name" maxlength="16" spellcheck="false" autocomplete="off">
    <div class="hint">ENTER TO RISE</div>
  </div>
</div>
<script>
(() => {
'use strict';
/* =========================================================================
   HOLLOW MEADOW — an ASCII world drawn one character at a time.

   How it works, so you can tinker:
   • The world is a grid of character cells. Each frame, every visible cell
     gets a glyph + foreground colour + background colour.
   • Glyphs are pre-rendered into an "atlas" and blitted straight into a
     pixel buffer. That is what lets us draw ~80,000 characters per frame,
     so the picture looks like an image from afar and like text up close.
   • Zoom changes the pixel size of a cell, not the world.
   • The knight is drawn with vector shapes on a hidden canvas, then each
     6x10 pixel block is converted into the best-matching character
     (edges become / \ | _ ( ), solid areas use a density ramp).
   • Water runs a real 2D wave equation, so ripples spread, bounce off the
     edges of puddles and fade.
   ========================================================================= */

/* ---------------- 1. CONFIG ---------------- */
const CFG = {
  walk: 24,            // columns per second
  run: 44,
  vScale: 0.46,        // rows moved per column of speed (top-down perspective)
  zoomMin: 3.5, zoomMax: 34, zoomPlay: 8.5, zoomTitle: 6,   // CSS px per character row
  pixelBudget: 2.3e6,  // max pixels we redraw per frame (auto-lowers if slow)
  maxCells: 95000,
  strikeMin: 6, strikeMax: 15,  // seconds between lightning strikes
  volume: 0.42,
};

/* ---------------- helpers ---------------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function hash(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y, s) => vnoise(x, y, s) * 0.57 + vnoise(x * 2.03, y * 2.03, s + 7) * 0.29 + vnoise(x * 4.1, y * 4.1, s + 13) * 0.14;
const K = (x, y) => (x + 1048576) * 2097152 + (y + 1048576);

/* ---------------- 2. GLYPHS ---------------- */
const GLYPHS = []; for (let c = 32; c < 127; c++) GLYPHS.push(String.fromCharCode(c));
const GI = {}; GLYPHS.forEach((g, i) => GI[g] = i);
const gi = s => [...s].map(c => GI[c]);
const FLIPV = new Uint8Array(GLYPHS.length).map((_, i) => i);
[['/', '\\'], ['^', 'v'], [',', "'"], ['_', '-'], ['"', ','], ['A', 'V'], ['M', 'W'], ['m', 'w'], ['`', ','], ['.', "'"]]
  .forEach(([a, b]) => { FLIPV[GI[a]] = GI[b]; FLIPV[GI[b]] = GI[a]; });

/* ---------------- 3. SCREEN / RENDERER ---------------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
let W = 0, H = 0, dprE = 1, bw = 0, bh = 0;
let fs = 0, cw = 0, ch = 0, cols = 0, rows = 0, masks = null;
let off, offCtx, offImg, buf32;
let CHR, FR, FG, FB, BR, BGc, BB, CLOUD, CGW = 0, CGH = 0;
let budget = CFG.pixelBudget, vignette = null;
let zoomCss = CFG.zoomTitle, zoomTarget = CFG.zoomTitle;
let x0 = 0, y0 = 0, offX = 0, offY = 0;

function setupScreen() {
  W = window.innerWidth; H = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  dprE = clamp(Math.min(dpr, Math.sqrt(budget / (W * H))), 0.5, 3);
  bw = Math.round(W * dprE); bh = Math.round(H * dprE);
  cv.width = bw; cv.height = bh;
  vignette = ctx.createRadialGradient(bw / 2, bh * 0.48, Math.min(bw, bh) * 0.28, bw / 2, bh * 0.48, Math.max(bw, bh) * 0.78);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.62)');
  fs = 0; applyZoom();
}
function applyZoom() {
  let nfs = Math.max(5, Math.round(zoomCss * dprE));
  // never draw more than maxCells characters
  while ((bw / Math.max(3, Math.round(nfs * 0.6))) * (bh / nfs) > CFG.maxCells) nfs++;
  if (nfs === fs) return;
  fs = nfs; ch = fs; cw = Math.max(3, Math.round(fs * 0.6));
  buildAtlas();
  cols = Math.ceil(bw / cw) + 3; rows = Math.ceil(bh / ch) + 3;
  const n = cols * rows;
  CHR = new Uint8Array(n); FR = new Uint8ClampedArray(n); FG = new Uint8ClampedArray(n); FB = new Uint8ClampedArray(n);
  BR = new Uint8ClampedArray(n); BGc = new Uint8ClampedArray(n); BB = new Uint8ClampedArray(n);
  off = document.createElement('canvas'); off.width = cols * cw; off.height = rows * ch;
  offCtx = off.getContext('2d');
  offImg = offCtx.createImageData(off.width, off.height);
  buf32 = new Uint32Array(offImg.data.buffer);
  CGW = Math.ceil(cols / 6) + 2; CGH = Math.ceil(rows / 6) + 2; CLOUD = new Float32Array(CGW * CGH);
}
function buildAtlas() {
  const n = GLYPHS.length, c = document.createElement('canvas');
  c.width = cw * n; c.height = ch;
  const g = c.getContext('2d', { willReadFrequently: true });
  const fam = 'ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace';
  const wt = fs < 11 ? 700 : fs < 18 ? 600 : 500;
  let px = ch * 0.94;
  g.font = `${wt} ${px}px ${fam}`;
  const mw = g.measureText('M').width;
  if (mw > cw * 1.06) { px *= cw * 1.06 / mw; g.font = `${wt} ${px}px ${fam}`; }
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i = 0; i < n; i++) g.fillText(GLYPHS[i], i * cw + cw / 2, ch * 0.54);
  const d = g.getImageData(0, 0, c.width, ch).data, gs = cw * ch;
  masks = new Uint8Array(n * gs);
  const boost = fs < 9 ? 1.5 : fs < 13 ? 1.2 : 1;
  for (let i = 0; i < n; i++) for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++)
    masks[i * gs + y * cw + x] = Math.min(255, d[(y * c.width + i * cw + x) * 4 + 3] * boost);
}
function blit(shakeX, shakeY) {
  const cwL = cw, chL = ch, stride = cols * cw, M = masks, gsz = cw * ch, B32 = buf32;
  let i = 0;
  for (let gy = 0; gy < rows; gy++) {
    const rowBase = gy * chL * stride;
    for (let gx = 0; gx < cols; gx++, i++) {
      const bR = BR[i], bG = BGc[i], bB = BB[i];
      const bgP = (0xff000000 | (bB << 16) | (bG << 8) | bR) >>> 0;
      let p0 = rowBase + gx * cwL;
      const g = CHR[i];
      if (g === 0) { for (let y = 0; y < chL; y++, p0 += stride) for (let x = 0; x < cwL; x++) B32[p0 + x] = bgP; continue; }
      const fR = FR[i], fG = FG[i], fB = FB[i];
      const fgP = (0xff000000 | (fB << 16) | (fG << 8) | fR) >>> 0;
      let mi = g * gsz;
      for (let y = 0; y < chL; y++, p0 += stride) {
        let p = p0;
        for (let x = 0; x < cwL; x++, p++, mi++) {
          const a = M[mi];
          if (a === 0) B32[p] = bgP;
          else if (a === 255) B32[p] = fgP;
          else { const ia = 255 - a; B32[p] = (0xff000000 | (((fB * a + bB * ia) >> 8) << 16) | (((fG * a + bG * ia) >> 8) << 8) | ((fR * a + bR * ia) >> 8)) >>> 0; }
        }
      }
    }
  }
  offCtx.putImageData(offImg, 0, 0);
  ctx.fillStyle = '#03050a'; ctx.fillRect(0, 0, bw, bh);
  ctx.drawImage(off, offX + shakeX, offY + shakeY);
}
// helpers for writing into the cell grid by world coordinate
function cellIdx(wx, wy) { const gx = wx - x0, gy = wy - y0; return (gx < 0 || gy < 0 || gx >= cols || gy >= rows) ? -1 : gy * cols + gx; }
function put(wx, wy, g, r, gg, b) { const i = cellIdx(wx, wy); if (i < 0) return -1; CHR[i] = g; FR[i] = r; FG[i] = gg; FB[i] = b; return i; }

/* ---------------- 4. WORLD GENERATION ---------------- */
const T_GRASS = 0, T_WATER = 1, T_SHORE = 2, T_PUDDLE = 3, T_MUD = 4, T_PATH = 5, T_TREE = 6, T_ROCK = 7,
      T_WALL = 8, T_FLOOR = 9, T_BRAZIER = 10, T_TRUNK = 11;
const BGT = [[5, 12, 8], [4, 10, 25], [9, 11, 11], [12, 18, 31], [11, 9, 8], [13, 11, 9], [3, 9, 7], [8, 9, 11],
             [14, 11, 10], [10, 10, 12], [10, 9, 9], [6, 5, 4]];
const CH = 64, chunks = new Map();
const LAKE = 0.39;
const lakeH = (wx, wy) => fbm(wx * 0.6 * 0.014, wy * 1.6 * 0.014, 1);
const pathV = (wx, wy) => Math.abs(fbm(wx * 0.6 * 0.009, wy * 1.6 * 0.009, 21) - 0.5);

// ruins: one possible ruin per 120x64 block
const RGX = 120, RGY = 64, ruinCache = new Map();
function ruinP(rx, ry) {
  const k = K(rx, ry); if (ruinCache.has(k)) return ruinCache.get(k);
  let p = null;
  if (hash(rx, ry, 71) < 0.42) {
    const w = 38 + Math.floor(hash(rx, ry, 72) * 22), h = 18 + Math.floor(hash(rx, ry, 73) * 7);
    const x = rx * RGX + 8 + Math.floor(hash(rx, ry, 74) * (RGX - w - 16));
    const y = ry * RGY + 6 + Math.floor(hash(rx, ry, 75) * (RGY - h - 12));
    let ok = true;
    for (const [px, py] of [[x, y], [x + w, y], [x, y + h], [x + w, y + h], [x + w / 2, y + h / 2]])
      if (lakeH(px, py) < 0.445) ok = false;
    if (ok) p = { x, y, w, h, door: x + Math.floor(w / 2) - 4 };
  }
  ruinCache.set(k, p); return p;
}
function ruinAt(wx, wy) {
  const p = ruinP(Math.floor(wx / RGX), Math.floor(wy / RGY)); if (!p) return null;
  const lx = wx - p.x, ly = wy - p.y;
  if (lx < 0 || ly < 0 || lx >= p.w || ly >= p.h) return null;
  for (const bx of [4, p.w - 11]) for (const by of [3, p.h - 9])
    if (lx >= bx && lx < bx + 7 && ly >= by && ly < by + 6) return { t: T_BRAZIER, code: (ly - by) * 7 + (lx - bx) };
  const wallV = lx < 3 || lx >= p.w - 3, wallH = ly < 2 || ly >= p.h - 2;
  if (wallV || wallH) {
    if (ly >= p.h - 2 && wx >= p.door && wx < p.door + 8) return { t: T_FLOOR };
    if (vnoise(wx * 0.17, wy * 0.3, 61) < 0.3) return { t: T_FLOOR, rubble: true };
    return { t: T_WALL, cap: wallH && (ly === 0 || ly === p.h - 2) };
  }
  return { t: T_FLOOR, rubble: hash(wx, wy, 62) < 0.03 };
}
// trees: jittered grid, canopies are spheres (circles on screen)
const TGX = 22, TGY = 12, treeCache = new Map();
function treeP(tx, ty) {
  const k = K(tx, ty); if (treeCache.has(k)) return treeCache.get(k);
  let p = null;
  const cx = tx * TGX + 4 + hash(tx, ty, 51) * (TGX - 8), cy = ty * TGY + 3 + hash(tx, ty, 52) * (TGY - 6);
  const forest = fbm(cx * 0.6 * 0.008, cy * 1.6 * 0.008, 9);
  if (lakeH(cx, cy) > 0.44 && pathV(cx, cy) > 0.035 && !ruinAt(Math.round(cx), Math.round(cy)) &&
      hash(tx, ty, 53) < (forest - 0.47) * 3.4) {
    const rx = 7 + hash(tx, ty, 54) * 7;
    p = { x: cx, y: cy, rx, ry: rx * 0.6, id: Math.floor(hash(tx, ty, 55) * 1000) };
  }
  treeCache.set(k, p); return p;
}
const TO = { kind: 0, shade: 0, d: 0, shadow: 0, lx: 0, bottom: false };
function treeAt(wx, wy) {
  const tx = Math.floor(wx / TGX), ty = Math.floor(wy / TGY);
  TO.kind = 0; TO.shadow = 0; let bestY = -1e9;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const p = treeP(tx + dx, ty + dy); if (!p) continue;
    const nx = (wx - p.x) / p.rx, ny = (wy - p.y) / p.ry, d2 = nx * nx + ny * ny;
    const edge = 1 - 0.24 * vnoise(wx * 0.5, wy * 0.8, 56 + p.id);
    if (d2 < edge && p.y > bestY) {
      bestY = p.y; TO.kind = 1;
      const nz = Math.sqrt(Math.max(0, 1 - d2));
      let s = -0.45 * nx - 0.55 * ny + 0.7 * nz;
      s += (vnoise(wx * 0.45, wy * 0.75, 57 + p.id) - 0.5) * 0.5 + (vnoise(wx * 1.3, wy * 2.1, 58) - 0.5) * 0.2;
      TO.shade = clamp(s, 0, 1.1); TO.d = Math.sqrt(d2 / edge);
    }
    if (TO.kind !== 1 && Math.abs(wx - p.x) <= 1.5 && wy > p.y + p.ry * 0.7 && wy <= p.y + p.ry + 2.5) {
      TO.kind = 2; TO.lx = Math.round(wx - p.x); TO.bottom = wy > p.y + p.ry + 1.5;
    }
    const sx = (wx - p.x - p.rx * 0.35) / (p.rx * 1.15), sy = (wy - p.y - p.ry * 0.6) / (p.ry * 0.85);
    const sd = 1 - (sx * sx + sy * sy); if (sd > TO.shadow) TO.shadow = Math.min(1, sd * 1.6);
  }
  return TO;
}
// rocks
const KGX = 28, KGY = 14, rockCache = new Map();
function rockP(kx, ky) {
  const k = K(kx, ky); if (rockCache.has(k)) return rockCache.get(k);
  let p = null;
  if (hash(kx, ky, 81) < 0.11) {
    const x = kx * KGX + 6 + hash(kx, ky, 82) * (KGX - 12), y = ky * KGY + 3 + hash(kx, ky, 83) * (KGY - 6);
    if (lakeH(x, y) > 0.42) { const rx = 2 + hash(kx, ky, 84) * 3.6; p = { x, y, rx, ry: rx * 0.5 }; }
  }
  rockCache.set(k, p); return p;
}

function genCell(wx, wy, c, i) {
  const r = hash(wx, wy, 3), r2 = (r * 7.31) % 1, r3 = (r * 13.7) % 1;
  c.r[i] = r;
  let t = T_GRASS, a = 0, b = 0, g = 0, cr = 0, cg = 0, cb = 0;
  const pick = (s, v) => GI[s[Math.floor(v * s.length) % s.length]];
  const h = lakeH(wx, wy);
  if (h < LAKE) { t = T_WATER; b = LAKE - h; }
  else if (h < LAKE + 0.016) {
    t = T_SHORE; b = (h - LAKE) / 0.016;
    if (r < 0.34 && b > 0.25) a = 1;
    else { g = pick('..:~,.o;:', r2); const v = 0.7 + r3 * 0.5; cr = 74 * v; cg = 78 * v; cb = 74 * v; }
  } else {
    const ru = ruinAt(wx, wy);
    if (ru) {
      t = ru.t;
      if (t === T_BRAZIER) {
        a = ru.code;
        if (ru.code === 0) c.braz.push({ x: wx + 3, y: wy + 1 });
      } else if (t === T_WALL) {
        const off = (wy & 1) * 3, m = (((wx + off) % 6) + 6) % 6, v = 0.75 + r3 * 0.5;
        if (ru.cap) { g = m === 0 ? GI['+'] : pick('==-=_=', r2); cr = 150 * v; cg = 140 * v; cb = 128 * v; }
        else if (m === 0) { g = pick('|]|[', r2); cr = 66; cg = 58; cb = 54; }
        else if (r < 0.1) { g = pick(',;"\':', r2); cr = 58; cg = 92; cb = 50; }
        else if (r > 0.96) { g = GI['/']; cr = 50; cg = 44; cb = 40; }
        else { g = pick('#HM%&8B$EN#H', r2); cr = 118 * v; cg = 104 * v; cb = 92 * v; }
      } else {
        const band = Math.floor(wy / 3), tx = (((wx + (band & 1) * 3) % 7) + 7) % 7, ty = ((wy % 3) + 3) % 3;
        if (ru.rubble) { g = pick('oO.,%@*o.', r2); const v = 0.6 + r3 * 0.6; cr = 96 * v; cg = 92 * v; cb = 88 * v; }
        else if (tx === 0) { g = GI['|']; cr = 52; cg = 54; cb = 60; }
        else if (ty === 2) { g = GI['_']; cr = 56; cg = 58; cb = 64; }
        else if (r < 0.62) g = 0;
        else if (r < 0.88) { g = pick('.:\'.', r2); cr = 70; cg = 72; cb = 78; }
        else if (r < 0.96) { g = pick(',;"', r2); cr = 50; cg = 84; cb = 46; }
        else { g = pick('/\\', r2); cr = 40; cg = 42; cb = 46; }
      }
    } else {
      const pth = pathV(wx, wy), onPath = pth < 0.018;
      const gx = wx * 0.6, gy = wy * 1.6;
      const pq = vnoise(gx * 0.12, gy * 0.12, 31) * 0.65 + vnoise(gx * 0.3, gy * 0.3, 32) * 0.35;
      const thr = onPath ? 0.6 : 0.735;
      if (pq > thr) { t = T_PUDDLE; b = pq - thr; }
      else if (pq > thr - 0.035) {
        t = T_MUD; g = pick('~.,:=.~,', r2); const v = 0.7 + r3 * 0.5; cr = 72 * v; cg = 58 * v; cb = 46 * v;
      } else if (onPath) {
        t = T_PATH;
        if (r > 0.95) { g = pick('oO0', r2); cr = 104; cg = 104; cb = 108; }
        else { g = pick(" ..,,:'`;.", r2); const v = 0.65 + r3 * 0.6; cr = 88 * v; cg = 75 * v; cb = 60 * v; }
      } else {
        const tr = treeAt(wx, wy);
        if (tr.kind === 1) { t = T_TREE; a = tr.shade; b = tr.d; }
        else if (tr.kind === 2) {
          t = T_TRUNK;
          if (tr.bottom) g = tr.lx < 0 ? GI['/'] : tr.lx > 0 ? GI['\\'] : GI['|'];
          else g = tr.lx < 0 ? pick('([{', r2) : tr.lx > 0 ? pick(')]}', r2) : pick('|IH#|', r2);
          const v = 0.7 + r3 * 0.5; cr = 70 * v; cg = 50 * v; cb = 36 * v;
        } else {
          const kx = Math.floor(wx / KGX), ky = Math.floor(wy / KGY), rk = rockP(kx, ky);

function convertSprite() {
  const d = sg.getImageData(0, 0, spr.width, spr.height).data, Wp = spr.width;
  for (let r = 0; r < SPR; r++) for (let c = 0; c < SPC; c++) {
    let sa = 0, sr = 0, sgc = 0, sb = 0, aL = 0, aR = 0, aT = 0, aB = 0, lL = 0, lR = 0, lT = 0, lB = 0;
    for (let y = 0; y < SPY; y++) {
      let p = ((r * SPY + y) * Wp + c * SPX) * 4;
      for (let x = 0; x < SPX; x++, p += 4) {
        const a = d[p + 3]; if (!a) continue;
        sa += a; sr += d[p] * a; sgc += d[p + 1] * a; sb += d[p + 2] * a;
        const lum = (d[p] * 3 + d[p + 1] * 6 + d[p + 2]) * a;
        if (x < SPX / 2) { aL += a; lL += lum; } else { aR += a; lR += lum; }
        if (y < SPY / 2) { aT += a; lT += lum; } else { aB += a; lB += lum; }
      }
    }
    const k = r * SPC + c, cov = sa / (SPX * SPY * 255);
    if (cov < 0.07) { S_CH[k] = 0; continue; }
    const R = sr / sa, G = sgc / sa, B = sb / sa, lum = R * 0.3 + G * 0.6 + B * 0.1;
    let mat = 1;
    if (B > 150 && B > R * 1.25 && lum > 110) mat = 3; else if (R > G * 1.5 && R > B * 1.2) mat = 2;
    S_R[k] = R; S_G[k] = G; S_B[k] = B; S_M[k] = mat;
    let chr;
    if (cov < 0.55) {   // silhouette edge: pick a character that hugs the covered side
      const dx = (aR - aL) / sa, dy = (aB - aT) / sa;
      if (mat === 3 && cov < 0.4) chr = cov < 0.2 ? GI['.'] : GI[':'];
      else if (Math.abs(dx) < 0.25 && Math.abs(dy) < 0.25) chr = cov < 0.25 ? GI['.'] : mat === 2 ? GI[';'] : GI['+'];
      else if (Math.abs(dx) > Math.abs(dy) * 1.6) chr = dx > 0 ? GI[cov < 0.3 ? '(' : '['] : GI[cov < 0.3 ? ')' : ']'];
      else if (Math.abs(dy) > Math.abs(dx) * 1.6) chr = dy > 0 ? GI[cov < 0.3 ? '.' : '_'] : GI[cov < 0.3 ? "'" : '"'];
      else chr = (dx > 0) === (dy > 0) ? GI['/'] : GI['\\'];
    } else {            // interior: use internal shading edges, else a density ramp
      const gxl = (aR ? lR / aR : 0) - (aL ? lL / aL : 0), gyl = (aB ? lB / aB : 0) - (aT ? lT / aT : 0);
      const gm = Math.sqrt(gxl * gxl + gyl * gyl) / 10;
      if (gm > 50 && mat !== 3) {
        if (Math.abs(gxl) > Math.abs(gyl) * 1.8) chr = GI['|'];
        else if (Math.abs(gyl) > Math.abs(gxl) * 1.8) chr = GI[gm > 85 ? '=' : '-'];
        else chr = (gxl > 0) === (gyl > 0) ? GI['/'] : GI['\\'];
      } else {
        const ramp = mat === 2 ? RAMP_CLOTH : mat === 3 ? RAMP_GLOW : RAMP_METAL;
        const v = Math.pow(lum / 255, 0.75);
        chr = ramp[clamp(Math.floor(v * (ramp.length - 1) * 1.1 + 0.5), 2, ramp.length - 1)];
      }
    }
    S_CH[k] = chr;
  }
}

/* ---------------- 9. INPUT ---------------- */
const startEl = document.getElementById('start'), pressEl = document.getElementById('press');
const nameBox = document.getElementById('namebox'), nameIn = document.getElementById('name');
const tagEl = document.getElementById('nametag'), hudEl = document.getElementById('hud'), zoomEl = document.getElementById('zoom');
let zoomHideT = 0;
function showZoom() { zoomEl.textContent = `ZOOM ${(zoomTarget / CFG.zoomPlay).toFixed(2)}x`; zoomEl.style.opacity = 1; zoomHideT = T + 1.4; }
function toNameStage() {
  stage = 'name'; pressEl.style.display = 'none'; nameBox.style.display = 'flex';
  nameIn.value = playerName; nameIn.focus(); nameIn.select();
}
function begin() {
  playerName = (nameIn.value || '').trim().slice(0, 16) || 'Knight';
  try { localStorage.setItem('hm_name', playerName); } catch (e) {}
  tagEl.textContent = playerName; tagEl.style.display = 'block';
  stage = 'play'; startEl.classList.add('gone'); nameIn.blur(); hudEl.style.opacity = 1;
  zoomTarget = CFG.zoomPlay; Snd.init();
}
startEl.addEventListener('pointerdown', e => { if (stage === 'title') { e.preventDefault(); Snd.init(); toNameStage(); } });
nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); begin(); } e.stopPropagation(); });
window.addEventListener('keydown', e => {
  if (stage === 'title') {
    if (e.ctrlKey || e.metaKey || e.altKey || /^(Shift|Control|Alt|Meta|Tab|F\d+)$/.test(e.key)) return;
    e.preventDefault(); Snd.init(); toNameStage(); return;
  }
  if (stage !== 'play') return;
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space' && !e.repeat) slash();
  if (e.code === 'KeyM') Snd.toggle();
  if (e.code === 'Equal' || e.code === 'NumpadAdd') { zoomTarget = clamp(zoomTarget * 1.2, CFG.zoomMin, CFG.zoomMax); showZoom(); }
  if (e.code === 'Minus' || e.code === 'NumpadSubtract') { zoomTarget = clamp(zoomTarget / 1.2, CFG.zoomMin, CFG.zoomMax); showZoom(); }
  if (e.code === 'Digit0') { zoomTarget = CFG.zoomPlay; showZoom(); }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
window.addEventListener('wheel', e => {
  e.preventDefault(); if (stage !== 'play') return;
  zoomTarget = clamp(zoomTarget * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0013)), CFG.zoomMin, CFG.zoomMax); showZoom();
}, { passive: false });
window.addEventListener('resize', setupScreen);

/* ---------------- 10. ACTIONS / EVENTS ---------------- */
function splashAt(wx, wy, s, n) {
  impulse(wx, wy, -4.2 * s, 2.1);
  for (let k = 0; k < n; k++) {
    const ang = Math.random() * 6.283, v = (3 + Math.random() * 11) * s;
    parts.push({ k: 0, x: wx + (Math.random() - 0.5) * 2, y: wy, z: 0.4, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v * 0.32,
                 vz: (7 + Math.random() * 15) * s, life: 0, max: 3 });
  }
}
function footstep(side) {
  const fx = P.x + facing * (side > 0 ? 3 : -2), fy = P.y;
  const t = typeAt(Math.round(fx), Math.round(fy));
  const s = running ? 1.5 : 1;
  if (t === T_PUDDLE || t === T_WATER) {
    splashAt(fx, fy, s * (t === T_WATER ? 1 + Math.min(1, depthRows / 6) : 1), running ? 26 : 16);
    Snd.splash(s);
  } else if (t === T_MUD) {
    Snd.squelch();
    for (let k = 0; k < 5; k++) parts.push({ k: 1, x: fx, y: fy, z: 0.3, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 2, vz: 4 + Math.random() * 6, life: 0, max: 2, c: [70, 55, 40] });
  } else Snd.step();
}
function slash() {
  if (T < slashCd) return;
  slashT = T; slashCd = T + 0.42; Snd.whoosh();
  let wetHit = false;
  for (let i = 3; i <= 16; i++) for (let j = -3; j <= 2; j++) {
    const wx = Math.round(P.x + facing * i), wy = Math.round(P.y + j);
    if ((i / 16) ** 2 + (j / 3.5) ** 2 > 1) continue;
    const t = typeAt(wx, wy);
    if (t === T_GRASS) {
      mark(CUT, wx, wy);
      if (Math.random() < 0.35) parts.push({ k: 2, x: wx, y: wy, z: 1 + Math.random() * 3, vx: facing * (6 + Math.random() * 12), vy: (Math.random() - 0.5) * 3,
                                             vz: 4 + Math.random() * 9, life: 0, max: 2.5 });
    } else if (isWet(t) && !wetHit && Math.random() < 0.2) { wetHit = true; splashAt(wx, wy, 0.8, 12); Snd.splash(0.6); }
  }
}
function strike() {
  pulses = [{ t: T, a: 1 }, { t: T + 0.1, a: 0.5 }, { t: T + 0.22, a: 0.9 }, { t: T + 0.45, a: 0.3 }];
  bolt = [];
  const c0 = Math.floor(cols * (0.1 + Math.random() * 0.8)), endR = Math.floor(rows * (0.35 + Math.random() * 0.45));
  const walk = (c, r, end, depth) => {
    while (r < end) {
      const d = Math.random() < 0.42 ? 0 : Math.random() < 0.5 ? -1 : 1;
      c += d; r += 1;
      bolt.push({ c, r, ch: d < 0 ? GI['/'] : d > 0 ? GI['\\'] : GI['|'], w: depth ? 0.6 : 1 });
      if (depth < 2 && Math.random() < 0.1) walk(c, r, Math.min(end, r + 4 + Math.floor(Math.random() * 9)), depth + 1);
    }
    return c;
  };
  const cEnd = walk(c0, 0, endR, 0);
  boltHit = { x: x0 + cEnd, y: y0 + endR, t: T };
  boltEnd = T + 0.45; shake = 0.8;
  const near = Math.random();
  thunderQ.push({ t: T + 0.35 + (1 - near) * 1.8, near });
  nextStrike = T + CFG.strikeMin + Math.random() * (CFG.strikeMax - CFG.strikeMin);
}

/* ---------------- 11. UPDATE ---------------- */
let simAcc = 0, lastMoveDir = 0;
function update(dt) {
  let mx = 0, my = 0;
  if (stage === 'play') {
    if (keys.KeyA || keys.ArrowLeft) mx -= 1;
    if (keys.KeyD || keys.ArrowRight) mx += 1;
    if (keys.KeyW || keys.ArrowUp) my -= 1;
    if (keys.KeyS || keys.ArrowDown) my += 1;
  }
  if (mx && my) { mx *= 0.7071; my *= 0.7071; }
  running = !!(keys.ShiftLeft || keys.ShiftRight);
  moving = !!(mx || my);
  if (mx) facing = mx > 0 ? 1 : -1;
  feetType = typeAt(Math.round(P.x), Math.round(P.y));
  const targetDepth = feetType === T_WATER ? clamp(Math.round(auxB(Math.round(P.x), Math.round(P.y)) * 120), 1, 14) : 0;
  depthRows += (targetDepth - depthRows) * (1 - Math.exp(-dt * 6));
  const spd = (running ? CFG.run : CFG.walk) * (feetType === T_WATER ? clamp(1 - depthRows / 22, 0.45, 1) : 1);
  P.x += mx * spd * dt; P.y += my * spd * CFG.vScale * dt;
  ampS += ((moving ? 1 : 0) - ampS) * (1 - Math.exp(-dt * 8));
  if (moving) {
    const prev = Math.sin(walkPhase);
    walkPhase += dt * (running ? 12.5 : 8.4);
    const now = Math.sin(walkPhase);
    if ((prev < 0) !== (now < 0)) footstep(now > 0 ? 1 : -1);
    if (T > trampleT) {
      trampleT = T + 0.08;
      for (let dx = -3; dx <= 3; dx++) for (let dy = -1; dy <= 0; dy++) {
        const wx = Math.round(P.x) + dx, wy = Math.round(P.y) + dy;
        if (typeAt(wx, wy) === T_GRASS) mark(TRAMPLE, wx, wy);
      }
    }
  }
  // wading: legs keep stirring the water
  if (feetType === T_WATER && T > wadeRipT) {
    wadeRipT = T + (moving ? 0.1 : 1.3);
    impulse(P.x + (Math.random() - 0.5) * 4, P.y, moving ? -1.6 : -0.7, 1.8);
  }
  const k = 1 - Math.exp(-dt * 6);
  cam.x += (P.x - cam.x) * k; cam.y += (P.y - 13 - cam.y) * k;

  zoomCss += (zoomTarget - zoomCss) * (1 - Math.exp(-dt * (stage === 'play' ? 6 : 1.2)));
  applyZoom();
  if (T > zoomHideT) zoomEl.style.opacity = 0;

  // weather
  gust = clamp(0.5 + 0.35 * Math.sin(T * 0.31) * Math.sin(T * 0.17 + 1) + 0.2 * Math.sin(T * 0.73), 0, 1);
  moonVis = smooth(0.3, 0.72, vnoise(T * 0.07, 3.3, 93));
  if (T >= nextStrike) strike();
  while (thunderQ.length && T >= thunderQ[0].t) { const q = thunderQ.shift(); Snd.thunder(q.near); shake = Math.max(shake, 0.25 + q.near * 0.5); }
  shake = Math.max(0, shake - dt * 2.2);
  flash = 0;
  for (const p of pulses) { const d = T - p.t; if (d >= 0) flash = Math.max(flash, p.a * Math.exp(-d * 7.5)); }
  if (pulses.length && T - pulses[pulses.length - 1].t > 2) pulses = [];

  // water sim (fixed 60 Hz)
  simRecenter(false);
  simAcc += dt; let n = 0;
  while (simAcc > 1 / 60 && n < 3) { simStep(); simAcc -= 1 / 60; n++; }
  if (n === 3) simAcc = 0;

  // rain hits on the ground and water
  const hits = Math.min(40, Math.floor(cols * rows / 3800) + (Math.random() < 0.5 ? 1 : 0));
  for (let h = 0; h < hits; h++) {
    const wx = x0 + Math.floor(Math.random() * cols), wy = y0 + Math.floor(Math.random() * rows);
    const t = typeAt(wx, wy);
    if (t === T_PUDDLE) { if (simIdx(wx, wy) >= 0) impulse(wx, wy, -0.7 - Math.random() * 0.5, 1.25); }
    else if (t === T_WATER) { if (Math.random() < 0.12 && simIdx(wx, wy) >= 0) impulse(wx, wy, -0.5, 1.25); }
    else if (t !== T_TREE && parts.length < 1500) parts.push({ k: 4, x: wx, y: wy, z: 0, vx: 0, vy: 0, vz: 0, life: 0, max: 0.22 });
  }
  // particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt;
    if (p.life > p.max) { parts.splice(i, 1); continue; }
    if (p.k === 4) continue;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    if (p.k === 3) { p.vz += (6 - p.vz) * dt * 0.8; p.vx += Math.sin(T * 3 + i) * dt * 6; }
    else { p.vz -= (p.k === 2 ? 22 : 62) * dt; if (p.k === 2) { p.vx *= 1 - dt * 2.5; } }
    if (p.k !== 3 && p.z <= 0) {
      const wx = Math.round(p.x), wy = Math.round(p.y);
      if (p.k === 0 && isWet(typeAt(wx, wy))) impulse(wx, wy, -0.55, 1.2);
      if (p.k === 2) { p.z = 0; p.vz = 0; p.vx = 0; p.vy = 0; if (p.max - p.life > 1.2) p.max = p.life + 1.2; continue; }
      parts.splice(i, 1);
    }
  }
  // brazier sparks
  for (const b of visibleBraziers) if (Math.random() < dt * 9 && parts.length < 1500)
    parts.push({ k: 3, x: b.x + (Math.random() - 0.5) * 3, y: b.y - 1, z: 2, vx: (Math.random() - 0.5) * 4, vy: 0, vz: 4 + Math.random() * 8, life: 0, max: 0.8 + Math.random() * 1.4 });
  // fireflies
  for (const f of flies) {
    f.vx += (Math.random() - 0.5) * dt * 30; f.vy += (Math.random() - 0.5) * dt * 14;
    f.vx *= 1 - dt * 0.8; f.vy *= 1 - dt * 0.8;
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (Math.abs(f.x - P.x) > 130 || Math.abs(f.y - P.y) > 60) { f.x = P.x + (Math.random() - 0.5) * 220; f.y = P.y + (Math.random() - 0.5) * 100; }
  }
  // rain streaks (screen space)
  const want = Math.min(1400, Math.floor(cols * rows / 85));
  while (drops.length < want) drops.push({ x: Math.random() * 1.3, y: Math.random(), s: 0.95 + Math.random() * 0.6, l: Math.random() });
  if (drops.length > want) drops.length = want;
  for (const d of drops) {
    d.y += d.s * dt; d.x -= d.s * dt * 0.28 * (0.8 + gust * 0.6);
    if (d.y > 1.02) { d.y = -0.03; d.x = Math.random() * 1.3; }
    if (d.x < -0.05) d.x += 1.3;
  }
  // regrow
  if ((T * 2 | 0) % 6 === 0) {
    for (const [k, t] of TRAMPLE) if (T - t > 10) TRAMPLE.delete(k);
    for (const [k, t] of CUT) if (T - t > 25) CUT.delete(k);
    if (!TRAMPLE.size && !CUT.size) { mbx0 = mby0 = 1e9; mbx1 = mby1 = -1e9; }
  }
  Snd.tick(dt);
}

/* ---------------- 12. DRAW ---------------- */
const GLT = [

  ['\\', 'v', 'V', 'v', '/'], ['\\', 'w', 'W', 'w', '/'], [',', '.', "'", '.', ','], ['"', "'", 'i', "'", '"'],

const LEAF = gi(" .,:;!+*vwxn%&8#B@");

  const moonCol = cols * 0.78;
  const chkMark = TRAMPLE.size + CUT.size > 0;
  const n = LN;
  let idx = 0;

  for (let y = 0; y + chp <= c.height; y += chp) {
    let line = '';
    for (let x = 0; x + cwp <= c.width; x += cwp) {
      let s = 0, l = 0, rgt = 0, tp = 0, bt = 0, n = 0;
      for (let yy = 0; yy < 8; yy++) for (let xx = 0; xx < cwp; xx++) {
        const a = d[((Math.floor(y) + yy) * c.width + x + xx) * 4 + 3] / 255; s += a; n++;
        if (xx < cwp / 2) l += a; else rgt += a; if (yy < 4) tp += a; else bt += a;
      }
      const cov = s / n;
      if (cov < 0.06) line += ' ';
      else if (cov < 0.6) {
        const dx = (rgt - l) / s, dy = (bt - tp) / s;
        if (Math.abs(dx) > Math.abs(dy) * 1.6) line += dx > 0 ? '(' : ')';
        else if (Math.abs(dy) > Math.abs(dx) * 1.6) line += dy > 0 ? '_' : '"';
        else if (Math.abs(dx) < 0.2) line += '.';
        else line += (dx > 0) === (dy > 0) ? '/' : '\\';
      } else line += ramp[Math.min(9, Math.floor(cov * 10))];
    }
    out += line.replace(/\s+$/, '') + '\n';
  }
  document.getElementById('logo').textContent = out;
}

/* ---------------- 14. BOOT + LOOP ---------------- */
setupScreen();
const sp0 = findSpawn(); P.x = sp0.x; P.y = sp0.y; cam.x = P.x; cam.y = P.y - 13;
simRecenter(true);
for (let i = 0; i < 46; i++) flies.push({ x: P.x + (Math.random() - 0.5) * 220, y: P.y + (Math.random() - 0.5) * 100, vx: 0, vy: 0, ph: Math.random() * 6.28, f: 0.6 + Math.random() * 1.4, g: 0 });
makeLogo();

let last = null, perfAcc = 0, perfN = 0;
function frame(now) {
  if (last === null) last = now;
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  const t0 = performance.now();
  update(dt); draw();
  perfAcc += performance.now() - t0; perfN++;
  if (perfN >= 90) {   // too slow? quietly lower resolution
    if (perfAcc / perfN > 24 && budget > 0.9e6) { budget *= 0.78; setupScreen(); }
    perfAcc = 0; perfN = 0;
  }
  window.requestAnimationFrame(frame);
}
window.__hm = { P, keys, get T() { return T; }, set zoom(v) { zoomTarget = zoomCss = v; applyZoom(); }, begin: () => { nameIn.value = 'Senje'; begin(); }, strike, slash, splashAt };
window.requestAnimationFrame(frame);
})();
